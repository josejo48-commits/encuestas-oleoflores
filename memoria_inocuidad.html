<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Memoria Inocuidad — OLEOFLORES</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a1628;
  --bg2: #0d1f3c;
  --card-back: #132240;
  --card-border: #1e3a6e;
  --gold: #f5c842;
  --teal: #00e5c8;
  --red: #ff4d6d;
  --green: #2dd36f;
  --white: #eef4ff;
  --panel: rgba(255,255,255,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(0,229,200,0.07) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(245,200,66,0.06) 0%, transparent 60%);
}

/* ── HEADER ── */
.header {
  text-align: center;
  padding: 18px 16px 10px;
  position: relative;
}
.header-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(15px, 4vw, 22px);
  font-weight: 900;
  color: var(--teal);
  text-shadow: 0 0 20px rgba(0,229,200,0.5);
  letter-spacing: 2px;
}
.header-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-top: 2px;
}
.stats-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 10px;
}
.stat-box {
  background: var(--panel);
  border: 1px solid rgba(0,229,200,0.15);
  border-radius: 10px;
  padding: 6px 16px;
  text-align: center;
}
.stat-val {
  font-family: 'Orbitron', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
}
.stat-lbl { font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-transform: uppercase; }

/* ── GRID ── */
#game-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(6px, 2vw, 12px);
  padding: clamp(8px, 3vw, 16px);
  max-width: 520px;
  margin: 0 auto;
}

/* ── CARTA ── */
.card {
  aspect-ratio: 3/4;
  cursor: pointer;
  perspective: 800px;
  position: relative;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(.4,0,.2,1);
  border-radius: 14px;
}
.card.flipped .card-inner { transform: rotateY(180deg); }
.card.matched .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  border-radius: 14px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Dorso */
.card-back {
  background: var(--card-back);
  border: 2px solid var(--card-border);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.card-back::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(45deg, rgba(0,229,200,0.04) 0px, rgba(0,229,200,0.04) 1px, transparent 1px, transparent 12px),
    repeating-linear-gradient(-45deg, rgba(0,229,200,0.04) 0px, rgba(0,229,200,0.04) 1px, transparent 1px, transparent 12px);
  border-radius: 12px;
}
.card-back-logo {
  font-size: clamp(22px, 6vw, 34px);
  filter: drop-shadow(0 0 8px rgba(0,229,200,0.6));
  z-index: 1;
}
.card-back-text {
  font-size: clamp(6px, 1.5vw, 8px);
  color: rgba(0,229,200,0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 4px;
  z-index: 1;
}

/* Frente */
.card-front {
  transform: rotateY(180deg);
  border: 2px solid transparent;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  padding: 8px 6px 6px;
  gap: 5px;
}
.card-front .card-emoji {
  font-size: clamp(26px, 7vw, 40px);
  line-height: 1;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
}
.card-front .card-label {
  font-size: clamp(7px, 1.8vw, 10px);
  font-weight: 800;
  text-align: center;
  line-height: 1.2;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Matched glow */
.card.matched .card-front {
  animation: matchPulse 0.5s ease forwards;
}
@keyframes matchPulse {
  0%   { transform: rotateY(180deg) scale(1); }
  40%  { transform: rotateY(180deg) scale(1.1); }
  100% { transform: rotateY(180deg) scale(1); }
}
.card.matched .card-inner {
  box-shadow: 0 0 20px var(--green), 0 0 40px rgba(45,211,111,0.3);
}

/* ── MODAL EDUCATIVO ── */
#edu-modal {
  position: fixed; inset: 0;
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: rgba(5, 15, 35, 0.88);
  backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
#edu-modal.show { opacity: 1; pointer-events: all; }

.edu-card {
  background: linear-gradient(145deg, #0d2040, #0a1628);
  border-radius: 22px;
  padding: 28px 24px 24px;
  max-width: 340px;
  width: 100%;
  border: 2px solid rgba(0,229,200,0.3);
  box-shadow: 0 0 40px rgba(0,229,200,0.15), 0 20px 60px rgba(0,0,0,0.6);
  text-align: center;
  transform: scale(0.85);
  transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
}
#edu-modal.show .edu-card { transform: scale(1); }

.edu-emoji { font-size: 56px; margin-bottom: 8px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
.edu-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px; font-weight: 700;
  color: var(--teal);
  margin-bottom: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.edu-text {
  font-size: 13px;
  line-height: 1.7;
  color: rgba(255,255,255,0.82);
  margin-bottom: 20px;
}
.edu-fact {
  background: rgba(245,200,66,0.08);
  border: 1px solid rgba(245,200,66,0.25);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 11px;
  color: var(--gold);
  margin-bottom: 20px;
  line-height: 1.5;
}
.edu-btn {
  background: var(--teal);
  color: #0a1628;
  border: none;
  border-radius: 50px;
  padding: 12px 32px;
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 16px rgba(0,229,200,0.3);
}
.edu-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,229,200,0.4); }

/* ── WIN SCREEN ── */
#win-screen {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(5,15,35,0.95);
  text-align: center; padding: 30px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s;
}
#win-screen.show { opacity: 1; pointer-events: all; }
.win-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(24px, 7vw, 38px);
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(245,200,66,0.6);
  margin-bottom: 8px;
}
.win-sub { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 24px; }
.win-stars { font-size: 48px; margin-bottom: 20px; }
.win-score {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px; color: var(--teal);
  margin-bottom: 28px;
}
.btn-restart {
  background: transparent;
  border: 2px solid var(--gold);
  border-radius: 50px;
  padding: 14px 40px;
  color: var(--gold);
  font-family: 'Orbitron', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-restart:hover { background: var(--gold); color: #0a1628; }

/* confetti */
.confetti-piece {
  position: fixed;
  width: 8px; height: 8px;
  top: -10px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  z-index: 201;
}
@keyframes confettiFall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🧬 MEMORIA INOCUIDAD</div>
  <div class="header-sub">OLEOFLORES · Inocuidad Alimentaria</div>
  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-val" id="stat-moves">0</div>
      <div class="stat-lbl">Intentos</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="stat-pairs">0/10</div>
      <div class="stat-lbl">Pares</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="stat-time">0s</div>
      <div class="stat-lbl">Tiempo</div>
    </div>
  </div>
</div>

<div id="game-grid"></div>

<!-- Modal educativo -->
<div id="edu-modal">
  <div class="edu-card">
    <div class="edu-emoji" id="edu-emoji"></div>
    <div class="edu-title" id="edu-title"></div>
    <div class="edu-text" id="edu-text"></div>
    <div class="edu-fact" id="edu-fact"></div>
    <button class="edu-btn" onclick="closeModal()">✓ ¡Entendido!</button>
  </div>
</div>

<!-- Win screen -->
<div id="win-screen">
  <div class="win-stars" id="win-stars">⭐⭐⭐</div>
  <div class="win-title">¡MISIÓN CUMPLIDA!</div>
  <div class="win-sub">Completaste el juego de memoria de inocuidad</div>
  <div class="win-score" id="win-score"></div>
  <button class="btn-restart" onclick="initGame()">↺ JUGAR DE NUEVO</button>
</div>

<script>
// ── DATOS DE LAS CARTAS ──
const CARDS = [
  {
    id: 'lavado_manos',
    emoji: '🙌',
    label: 'Lavado de Manos',
    color: ['#0d3b8c','#1a5fcc'],
    border: '#4d9fff',
    title: 'LAVADO DE MANOS',
    text: 'El lavado de manos es la barrera más efectiva contra la contaminación. Debe realizarse antes de manipular alimentos, después del baño y al cambiar de actividad.',
    fact: '💡 La OMS estima que el lavado de manos correcto puede prevenir hasta el 40% de las enfermedades transmitidas por alimentos.'
  },
  {
    id: 'tabla_picar',
    emoji: '🔪',
    label: 'Tabla Separada',
    color: ['#3b1a0a','#7a3510'],
    border: '#ff8c42',
    title: 'TABLA DE PICAR SEPARADA',
    text: 'Usar tablas de picar diferentes para carnes crudas, vegetales y alimentos cocidos evita la contaminación cruzada. Se recomienda el sistema de colores por tipo de alimento.',
    fact: '💡 La contaminación cruzada es una de las principales causas de brotes de enfermedades alimentarias en la industria.'
  },
  {
    id: 'temperatura',
    emoji: '🌡️',
    label: 'Temperatura Cocción',
    color: ['#5c0d0d','#b01c1c'],
    border: '#ff4d4d',
    title: 'TEMPERATURA DE COCCIÓN',
    text: 'Los alimentos deben cocinarse a temperaturas que eliminen los patógenos. Las carnes deben alcanzar al menos 74°C en el centro, el pollo 82°C y el cerdo 71°C.',
    fact: '💡 Zona de peligro: entre 5°C y 60°C las bacterias se duplican cada 20 minutos. ¡Fuera de esa zona son seguras!'
  },
  {
    id: 'zona_peligro',
    emoji: '⚠️',
    label: 'Zona de Peligro',
    color: ['#4a2e00','#8c5a00'],
    border: '#f5c842',
    title: 'ZONA DE PELIGRO TÉRMICO',
    text: 'La zona de peligro es el rango entre 5°C y 60°C donde las bacterias crecen más rápido. Los alimentos no deben permanecer más de 2 horas en esta zona.',
    fact: '💡 En OLEOFLORES monitoreamos la temperatura de todos los procesos para mantener los alimentos fuera de la zona de peligro.'
  },
  {
    id: 'lavado_frutas',
    emoji: '🍎',
    label: 'Lavado de Frutas',
    color: ['#0d3d1a','#1a7a35'],
    border: '#2dd36f',
    title: 'LAVADO DE FRUTAS Y VERDURAS',
    text: 'Todas las frutas y verduras deben lavarse con agua potable antes de su uso, incluso si van a ser peladas. Los pesticidas y microorganismos se concentran en la superficie.',
    fact: '💡 El lavado con agua corriente es suficiente para eliminar más del 90% de los residuos superficiales en frutas y verduras.'
  },
  {
    id: 'contam_cruzada',
    emoji: '🚫',
    label: 'Contam. Cruzada',
    color: ['#1a0a3d','#3d1a8c'],
    border: '#9b59b6',
    title: 'CONTAMINACIÓN CRUZADA',
    text: 'La contaminación cruzada ocurre cuando microorganismos pasan de un alimento a otro a través de superficies, manos o utensilios. Es una causa frecuente de intoxicaciones.',
    fact: '💡 Separar los alimentos crudos de los cocidos en el refrigerador y durante la preparación reduce significativamente el riesgo de contaminación cruzada.'
  },
  {
    id: 'refrigeracion',
    emoji: '❄️',
    label: 'Refrigeración',
    color: ['#0a2040','#0d4080'],
    border: '#00e5c8',
    title: 'REFRIGERACIÓN ADECUADA',
    text: 'La refrigeración a 4°C o menos detiene el crecimiento bacteriano. Los alimentos perecederos deben refrigerarse dentro de las 2 horas siguientes a su preparación.',
    fact: '💡 El congelador (-18°C) no mata las bacterias, solo detiene su crecimiento. Al descongelar, el control de temperatura vuelve a ser crítico.'
  },
  {
    id: 'enfriado_rapido',
    emoji: '🧊',
    label: 'Enfriado Rápido',
    color: ['#003348','#006699'],
    border: '#00cfff',
    title: 'ENFRIADO RÁPIDO',
    text: 'Los alimentos calientes deben enfriarse rápidamente para pasar la zona de peligro lo más rápido posible. El objetivo es bajar de 60°C a 21°C en menos de 2 horas.',
    fact: '💡 Técnicas de enfriado rápido: baño maría con hielo, dividir en porciones pequeñas o usar abatidores de temperatura industriales.'
  },
  {
    id: 'materias_primas',
    emoji: '🌾',
    label: 'Materias Primas',
    color: ['#2d1a00','#6b3f00'],
    border: '#d4a017',
    title: 'MATERIAS PRIMAS SEGURAS',
    text: 'La inocuidad comienza desde la selección de proveedores. Las materias primas deben provenir de fuentes certificadas, con trazabilidad completa y cumplir especificaciones de calidad.',
    fact: '💡 En OLEOFLORES aplicamos la norma ISO 22000 desde la recepción de materias primas hasta el producto terminado.'
  },
  {
    id: 'agua_segura',
    emoji: '💧',
    label: 'Agua Segura',
    color: ['#003d4d','#007a99'],
    border: '#00b4d8',
    title: 'AGUA SEGURA',
    text: 'El agua usada en la producción de alimentos debe ser potable y libre de contaminantes microbiológicos y químicos. Es un requisito fundamental de la ISO 22000.',
    fact: '💡 El agua contaminada es responsable de más de 2 millones de casos de enfermedades gastrointestinales al año en la industria alimentaria.'
  }
];

// ── ESTADO ──
let board = [], flipped = [], matched = 0, moves = 0, canFlip = false;
let timerInterval = null, seconds = 0, gameStarted = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initGame() {
  document.getElementById('win-screen').classList.remove('show');
  clearInterval(timerInterval);
  seconds = 0; moves = 0; matched = 0; flipped = []; canFlip = false; gameStarted = false;
  updateStats();

  // Duplicar cartas y mezclar
  board = shuffle([...CARDS, ...CARDS].map((c, i) => ({ ...c, uid: i })));

  const grid = document.getElementById('game-grid');
  grid.innerHTML = '';

  board.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <div class="card-back-logo">🧬</div>
          <div class="card-back-text">INOCUIDAD</div>
        </div>
        <div class="card-face card-front" style="background:linear-gradient(145deg,${card.color[0]},${card.color[1]});border-color:${card.border}40;">
          <div class="card-emoji">${card.emoji}</div>
          <div class="card-label" style="color:${card.border};">${card.label}</div>
        </div>
      </div>`;
    el.addEventListener('click', () => onCardClick(idx));
    grid.appendChild(el);
  });

  // Pequeña animación de entrada
  setTimeout(() => {
    canFlip = true;
    // Mostrar todas brevemente
    grid.querySelectorAll('.card').forEach((c, i) => {
      setTimeout(() => c.classList.add('flipped'), i * 40);
    });
    setTimeout(() => {
      grid.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
    }, 1200);
  }, 300);
}

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    document.getElementById('stat-time').textContent = seconds + 's';
  }, 1000);
}

function updateStats() {
  document.getElementById('stat-moves').textContent = moves;
  document.getElementById('stat-pairs').textContent = matched + '/10';
  document.getElementById('stat-time').textContent = seconds + 's';
}

function onCardClick(idx) {
  if (!canFlip) return;
  const el = document.querySelectorAll('.card')[idx];
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flipped.length >= 2) return;

  if (!gameStarted) { gameStarted = true; startTimer(); }

  el.classList.add('flipped');
  flipped.push(idx);

  if (flipped.length === 2) {
    canFlip = false;
    moves++;
    updateStats();
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const ca = board[a], cb = board[b];
  const cards = document.querySelectorAll('.card');

  if (ca.id === cb.id) {
    // ¡Par encontrado!
    setTimeout(() => {
      cards[a].classList.add('matched');
      cards[b].classList.add('matched');
      matched++;
      updateStats();
      flipped = [];
      canFlip = true;
      // Mostrar modal educativo
      showModal(ca);
    }, 400);
  } else {
    // No coinciden — voltear de vuelta
    setTimeout(() => {
      cards[a].classList.remove('flipped');
      cards[b].classList.remove('flipped');
      flipped = [];
      canFlip = true;
    }, 900);
  }
}

function showModal(card) {
  document.getElementById('edu-emoji').textContent = card.emoji;
  document.getElementById('edu-title').textContent = '✅ ' + card.title;
  document.getElementById('edu-text').textContent = card.text;
  document.getElementById('edu-fact').textContent = card.fact;
  document.getElementById('edu-modal').classList.add('show');
}

function closeModal() {
  document.getElementById('edu-modal').classList.remove('show');
  if (matched === 10) {
    setTimeout(showWin, 400);
  }
}

function showWin() {
  clearInterval(timerInterval);
  const stars = moves <= 14 ? '⭐⭐⭐' : moves <= 20 ? '⭐⭐' : '⭐';
  document.getElementById('win-stars').textContent = stars;
  document.getElementById('win-score').textContent = `${moves} intentos · ${seconds} segundos`;
  document.getElementById('win-screen').classList.add('show');
  launchConfetti();
}

function launchConfetti() {
  const colors = ['#f5c842','#00e5c8','#ff4d6d','#2dd36f','#00cfff','#ff8c42'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left:${Math.random()*100}vw;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation-duration:${1.5+Math.random()*2}s;
        animation-delay:${Math.random()*0.5}s;
        transform:rotate(${Math.random()*360}deg);
        width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }, i * 40);
  }
}

// Iniciar
initGame();
</script>
</body>
</html>
